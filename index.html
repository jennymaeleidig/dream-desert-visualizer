<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Dream Desert Visualizer (p5)</title>
    <style>
      @font-face {
        font-family: "VCR";
        src: url("/assets/fonts/vcr.ttf") format("truetype");
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color-scheme: dark;
        overflow: hidden;
      }

      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        width: 100%;
        height: 100%;
        gap: 0.25rem;
      }

      @media (min-aspect-ratio: 101/100) {
        #app {
          flex-direction: row;
        }
      }

      /* Square canvas container - shrinks to leave room for controls */
      #canvas-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        position: relative;
        background: #000;
        /* Spacing values for canvas container */
        --canvas-mobile-gap: 64px;
        --canvas-mobile-controls: 64px;
        --canvas-desktop-gap: 64px;
        --canvas-desktop-controls: 64px;

        width: min(
          calc(100vw - var(--canvas-mobile-gap)),
          calc(100dvh - var(--canvas-mobile-controls))
        );
        height: min(
          calc(100vw - var(--canvas-mobile-gap)),
          calc(100dvh - var(--canvas-mobile-controls))
        );
        aspect-ratio: 1 / 1;
        max-width: calc(100vw - var(--canvas-mobile-gap));
        max-height: calc(100dvh - var(--canvas-mobile-controls));
      }

      @media (min-aspect-ratio: 101/100) {
        #canvas-wrap {
          width: min(
            calc(100vw - var(--canvas-desktop-controls)),
            calc(100dvh - var(--canvas-desktop-gap))
          );
          height: min(
            calc(100vw - var(--canvas-desktop-controls)),
            calc(100dvh - var(--canvas-desktop-gap))
          );
          max-width: calc(100vw - var(--canvas-desktop-controls));
          max-height: calc(100dvh - var(--canvas-desktop-gap));
        }
      }

      /* Scale the 512x512 canvas to fill its container */
      #canvas-wrap > canvas {
        width: 100%;
        height: 100%;
        display: block;
        max-width: 100%;
        max-height: 100%;
      }

      /* Controls bar - hidden until scene loads, adjacent to canvas */
      #mobile-controls {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease-out;
      }

      #mobile-controls.visible {
        opacity: 1;
        pointer-events: auto;
      }

      @media (min-aspect-ratio: 101/100) {
        #mobile-controls {
          flex-direction: column;
        }
      }

      #mobile-controls button {
        font-family: "VCR", monospace;
        font-size: 16px;
        color: #d46a27;
        background: #000;
        border: 2px solid #d46a27;
        width: 44px;
        padding: 8px 0;
        text-align: center;
        cursor: pointer;
        line-height: 1;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
      }

      /* Collapse shared borders between adjacent buttons */
      #mobile-controls button:not(:first-child) {
        border-left: none;
      }

      @media (min-aspect-ratio: 101/100) {
        #mobile-controls button:not(:first-child) {
          border-left: 2px solid #d46a27;
          border-top: none;
        }
      }

      #mobile-controls button:active,
      #mobile-controls button.pressed {
        background: #d46a27;
        color: #000;
      }

      /* Loading overlay with VHS font and orange text */
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        font-family: "VCR", monospace;
        font-size: 24px;
        color: #d46a27; /* orange */
        transition: opacity 0.3s ease-out;
      }

      #loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Animated ellipsis */
      .loading-dots {
        display: inline-block;
        width: 3ch; /* Fixed width to fit 3 dots */
        text-align: left;
      }

      .loading-dots::after {
        content: "";
        animation: ellipsis 1.5s infinite;
      }

      @keyframes ellipsis {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
        100% {
          content: "";
        }
      }

      /* Info button - fixed top-right corner */
      #info-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1001;
        font-family: "VCR", monospace;
        font-size: 16px;
        color: #d46a27;
        background: #000;
        border: 2px solid #d46a27;
        width: 44px;
        height: 44px;
        padding: 0;
        text-align: center;
        cursor: pointer;
        line-height: 1;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
      }

      #info-btn:active {
        background: #d46a27;
        color: #000;
      }

      /* Info tooltip */
      #info-tooltip {
        position: fixed;
        top: 62px;
        right: 12px;
        z-index: 1001;
        font-family: "VCR", monospace;
        font-size: clamp(14px, 1.6vmin, 14px);
        line-height: 1.5;
        color: #d46a27;
        background: #000;
        border: 2px solid #d46a27;
        padding: 12px;
        max-width: min(280px, calc(100vw - 24px));
        box-sizing: border-box;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-out;
      }

      #info-tooltip.visible {
        opacity: 1;
        pointer-events: auto;
      }

      #info-tooltip a {
        color: #cf8616;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      #info-tooltip a:visited {
        color: #cf8616;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-wrap" aria-hidden="false">
        <div id="loading-overlay">
          Loading<span class="loading-dots"></span>
        </div>
      </div>
      <div id="mobile-controls">
        <button id="btn-prev" aria-label="Previous track">|&lt;</button>
        <button id="btn-play" aria-label="Play">&gt;</button>
        <button id="btn-next" aria-label="Next track">&gt;|</button>
      </div>
    </div>
    <button id="info-btn" aria-label="About this project">?</button>
    <div id="info-tooltip" aria-hidden="true">
      <a href="https://jennyleidig.straw.page/" target="_blank" rel="noopener"
        >My</a
      >
      interpretation of
      <a
        href="https://geometriclullaby.bandcamp.com/album/desert-sand-feels-warm-at-night"
        target="_blank"
        rel="noopener"
        >夢の砂漠</a
      >
      by
      <a href="https://desertsand.bandcamp.com/" target="_blank" rel="noopener"
        >desert sand feels warm at night</a
      >
      &amp;
      <a
        href="https://www.instagram.com/secretschools/"
        target="_blank"
        rel="noopener"
        >Secret Schools</a
      ><br /><br />
      <a
        href="https://github.com/jennymaeleidig/dream-desert-visualizer"
        target="_blank"
        rel="noopener"
        >Built</a
      >
      with p5.js &amp; GLSL<br />
      Assets re-created by hand & programatically
    </div>

    <script>
      (function () {
        const btn = document.getElementById("info-btn");
        const tip = document.getElementById("info-tooltip");

        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          btn.blur();
          const open = tip.classList.toggle("visible");
          tip.setAttribute("aria-hidden", String(!open));
        });

        document.addEventListener("click", function (e) {
          if (!tip.classList.contains("visible")) return;
          if (tip.contains(e.target)) return;
          tip.classList.remove("visible");
          tip.setAttribute("aria-hidden", "true");
        });
      })();
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
